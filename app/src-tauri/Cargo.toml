[package]
name = "toolsboxapp"
version = "2026.1.1"
description = "ToolsBoXApp - desktop toolbox bundling the ToolsBoXMachine content"
authors = ["RackRunner"]
license = "Unlicense"
repository = "https://github.com/RackRunner1/ToolsBoXApp"
edition = "2021"
rust-version = "1.77.2"

[workspace]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.3", features = ["wry", "protocol-asset"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = []

[profile.release]
strip = true
lto = true

