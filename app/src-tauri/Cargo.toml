[package]
name = "toolsboxapp"
version = "2026.1.1"
description = "ToolBoXApp - boite a outils desktop embarquant le contenu de ToolsBoXMachine"
authors = ["RackRunner"]
license = "Unlicense"
repository = "https://github.com/RackRunner1/ToolsBoXApp"
edition = "2021"
rust-version = "1.77.2"

# Projet autonome : ce crate est sa propre racine de workspace.
[workspace]

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.2", features = ["wry"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

[features]
# Utilise par `tauri build` en release pour eviter l'avertissement sur le
# protocole custom non securise (les assets sont deja servis en https).
default = ["custom-protocol"]
custom-protocol = []

[profile.release]
strip = true      # binaire plus petit
lto = true        # optimise (build un peu plus long)

