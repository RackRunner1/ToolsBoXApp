[package]
name = "toolsboxapp"
version = "2026.1.1"
description = "ToolsBoXApp - desktop toolbox bundling the ToolsBoXMachine content"
authors = ["RackRunner"]
license = "Unlicense"
repository = "https://github.com/RackRunner1/ToolsBoXApp"
edition = "2021"
rust-version = "1.77.2"

# Standalone project: this crate is its own workspace root.
[workspace]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.3", features = ["wry"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri build` in release to avoid the warning about the insecure
# custom protocol (assets are already served over https).
default = ["custom-protocol"]
custom-protocol = []

[profile.release]
strip = true      # smaller binary
lto = true        # optimized (slightly longer build)

