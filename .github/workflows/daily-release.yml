name: Daily Build & Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      do_release:
        description: "Créer / mettre à jour la release GitHub (YYYYMMDD)"
        type: boolean
        default: true
      do_sync:
        description: "Synchroniser contents/ depuis ToolsBoXMachine"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Calculer date, version et options
        id: vars
        shell: pwsh
        run: |
          $d = [DateTime]::UtcNow
          $version = "1.0.$($d.Year - 2000).$($d.DayOfYear)"
          $tag     = $d.ToString('yyyyMMdd')

          $doSync = $false; $doRelease = $false
          switch ($env:GITHUB_EVENT_NAME) {
            'schedule'          { $doSync = $true;  $doRelease = $true  }
            'workflow_dispatch' {
              $doSync    = "${{ inputs.do_sync }}"    -ne 'false'
              $doRelease = "${{ inputs.do_release }}" -ne 'false'
            }
            default             { throw "Événement inattendu : $env:GITHUB_EVENT_NAME" }
          }

          "version=$version"   >> $env:GITHUB_OUTPUT
          "tag=$tag"           >> $env:GITHUB_OUTPUT
          "do_sync=$($doSync.ToString().ToLower())"     >> $env:GITHUB_OUTPUT
          "do_release=$($doRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Debug "tag=$tag version=$version sync=$doSync release=$doRelease"

      - name: Synchroniser contents/ depuis ToolsBoXMachine
        if: steps.vars.outputs.do_sync == 'true'
        shell: pwsh
        run: .\scripts\sync-contents.ps1

      - name: Commit & push contents/
        if: steps.vars.outputs.do_sync == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A contents
          if ($LASTEXITCODE -ne 0) { throw "git add a échoué" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Debug "Aucun changement dans contents/ (source inchangée)."
          } else {
            git commit -m "chore(contents): synchro ToolsBoXMachine ${{ steps.vars.outputs.tag }}" | Out-Null
            try { git push }
            catch {
              Write-Debug "Push refusé, tentative de rebase puis nouvelle tentative."
              git pull --rebase
              git push
            }
            if ($LASTEXITCODE -ne 0) { throw "git push a échoué" }
          }

      - name: Préparer le certificat de signature
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certs -Force | Out-Null
          $pfx = Join-Path (Get-Location) "certs\ToolsBoXApp.pfx"

          if ($env:CERT_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
            $pass = $env:CERT_PASSWORD
            $mode = "stable"
            Write-Debug "Certificat : secret CERT_BASE64 (stable)."
          } else {
            Write-Debug "Secret CERT_BASE64 absent -> certificat auto-signé ÉPHÉMÈRE." +
              "Les mises à jour auto (.appinstaller) ne seront pas fiables d'un jour à l'autre." +
              "Voir README (section « Certificat de signature »)."
            $c = New-SelfSignedCertificate `
                   -Type CodeSigningCert `
                   -Subject "CN=RackRunner" `
                   -CertStoreLocation "Cert:\CurrentUser\My" `
                   -KeyUsage DigitalSignature `
                   -FriendlyName "ToolsBoXApp" `
                   -HashAlgorithm SHA256 `
                   -NotAfter (Get-Date).AddYears(5)
            $pass = [Guid]::NewGuid().ToString('N')
            Export-PfxCertificate -Cert $c -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
            $mode = "ephemeral"
          }

          Write-Output "::add-mask::$pass"
          "PFX_PATH=$pfx"   >> $env:GITHUB_ENV
          "PFX_PASS=$pass"  >> $env:GITHUB_ENV
          "PFX_MODE=$mode"  >> $env:GITHUB_ENV
          "mode=$mode"      >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $pass)
          Write-Debug "Sujet du certificat : $($cert.Subject)"
          $cerBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [IO.File]::WriteAllBytes("$pwd\artifacts\ToolsBoXApp.cer", $cerBytes)

          if ($cert.Subject -ne "CN=RackRunner") {
            Write-Debug "Le sujet du certificat ($($cert.Subject)) ne correspond pas au Publisher du manifeste (CN=RackRunner)."
          }

      - name: Injecter la version dans Package.appxmanifest
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.version }}"
          $m = "src\ToolsBoXApp\Package.appxmanifest"
          $xml = [IO.File]::ReadAllText($m)
          $new = [regex]::Replace(
            $xml,
            '(<Identity\b[^>]*?Version=")\d+\.\d+\.\d+\.\d+(")',
            { param($g) $g.Groups[1].Value + $ver + $g.Groups[2].Value },
            'Singleline')
          if ($new -eq $xml) { throw "Impossible d'injecter la version $ver dans $m" }
          [IO.File]::WriteAllText($m, $new)
          Write-Debug "Manifeste versionné : $ver"

      - name: Localiser MSBuild
        id: msb
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere introuvable" }
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild introuvable sur le runner" }
          "path=$msbuild" >> $env:GITHUB_OUTPUT
          Write-Debug "MSBuild : $msbuild"

      - name: Compiler et signer le package MSIX (x64)
        shell: pwsh
        run: |
          & "${{ steps.msb.outputs.path }}" "src\ToolsBoXApp\ToolsBoXApp.csproj" `
            /t:Restore,Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:Version="${{ steps.vars.outputs.version }}" `
            /p:SignCertPath="$env:PFX_PATH" `
            /p:SignCertPassword="$env:PFX_PASS" `
            /m
          if ($LASTEXITCODE -ne 0) { throw "msbuild a échoué (code $LASTEXITCODE)" }

      - name: Vérifier le package produit
        id: verify
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "src\ToolsBoXApp.Package\AppX" -Filter "*.msix" -Recurse |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $found) { throw "MSIX introuvable dans src\ToolsBoXApp.Package\AppX" }
          $msix = Get-Item (Join-Path $found.DirectoryName "ToolsBoXApp_x64.msix") -ErrorAction SilentlyContinue
          if (-not $msix -or ($found.FullName -ne $msix.FullName)) {
            Move-Item $found.FullName (Join-Path $found.DirectoryName "ToolsBoXApp_x64.msix") -Force
            $msix = Get-Item (Join-Path $found.DirectoryName "ToolsBoXApp_x64.msix")
          }
          Write-Debug "MSIX : $($msix.FullName) ($([int]($msix.Length/1MB)) Mo)"
          "MSIX_PATH=$($msix.FullName)" >> $env:GITHUB_ENV

          $sig = Get-AuthenticodeSignature $msix.FullName
          Write-Debug "Signature : $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -in @('NotSigned','HashMismatch','NotTrustedFile')) {
            throw "Signature du MSIX invalide : $($sig.Status)"
          }
          if ($sig.Status -ne 'Valid') {
            Write-Debug "Certificat non encore approuvé par cette machine ($($sig.Status))." +
              "Les utilisateurs devront installer ToolsBoXApp.cer une fois (Trusted People)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($need in @('AppxManifest.xml','ToolsBoXApp.exe','contents/index.html')) {
              if ($names -notcontains $need) {
                throw "Fichier manquant dans le MSIX : $need (le contenu synchro n'est pas embarqué ?)"
              }
            }
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            $sr = New-Object IO.StreamReader($entry.Open(), [Text.Encoding]::UTF8)
            $manifestXml = $sr.ReadToEnd(); $sr.Close()

            [xml]$mx = $manifestXml
            $ns = New-Object System.Xml.XmlNamespaceManager($mx.NameTable)
            $ns.AddNamespace('m','http://schemas.microsoft.com/appx/manifest/foundation/windows10')
            $id = $mx.SelectSingleNode('//m:Identity', $ns)
            "PKG_NAME=$($id.Name)"                 >> $env:GITHUB_ENV
            "PKG_PUBLISHER=$($id.Publisher)"       >> $env:GITHUB_ENV
            "PKG_VERSION=$($id.Version)"           >> $env:GITHUB_ENV
            "PKG_ARCH=$($id.ProcessorArchitecture)" >> $env:GITHUB_ENV

            $depNodes = $mx.SelectNodes('//m:Dependencies/m:Package', $ns)
            $deps = @()
            foreach ($dn in $depNodes) { $deps += $dn.OuterXml }
            "PKG_DEPS=$($deps -join ' ')" >> $env:GITHUB_ENV
          } finally { $zip.Dispose() }

          if ($id.Version -ne "${{ steps.vars.outputs.version }}") {
            throw "Version du paquet ($($id.Version)) différente de la version attendue (${{ steps.vars.outputs.version }})."
          }
          "msix=$($msix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Générer le .appinstaller
        shell: pwsh
        run: |
          $base    = "https://github.com/${{ github.repository }}/releases/latest/download"
          $version = "${{ steps.vars.outputs.version }}"

          $xmlLines = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<AppInstaller xmlns="http://schemas.microsoft.com/appx/appinstaller/2017/2"'
            '              xmlns:s4="http://schemas.microsoft.com/appx/appinstaller/2021"'
            ('              Uri="' + $base + '/ToolsBoXApp.appinstaller"')
            ('              Version="' + $version + '">')
            '  <UpdateSettings OnLaunch="true"'
            '                  HoursBetweenUpdateChecks="0"'
            '                  ShowPrompt="true"'
            '                  UpdateBlocksActivation="false"'
            '                  s4:ForceUpdateFromAnyVersion="false" />'
            ('  <MainPackage Name="' + $env:PKG_NAME + '"')
            ('               Publisher="' + $env:PKG_PUBLISHER + '"')
            ('               Version="' + $version + '"')
            '               ProcessorArchitecture="x64"'
            ('               Uri="' + $base + '/ToolsBoXApp_x64.msix" />')
            '</AppInstaller>'
          )
          $xml = ($xmlLines -join "`r`n") + "`r`n"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          [IO.File]::WriteAllText("$pwd\artifacts\ToolsBoXApp.appinstaller", $xml)

          $sums = foreach ($f in @("$env:MSIX_PATH", "$pwd\artifacts\ToolsBoXApp.appinstaller", "$pwd\artifacts\ToolsBoXApp.cer")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $h, (Split-Path $f -Leaf)
          }
          [IO.File]::WriteAllLines("$pwd\artifacts\checksums.txt", $sums)

          Get-Content "$pwd\artifacts\ToolsBoXApp.appinstaller" | Write-Debug

      - name: Préparer les notes de release
        id: notes
        if: steps.vars.outputs.do_release == 'true'
        shell: pwsh
        run: |
          $tag  = "${{ steps.vars.outputs.tag }}"
          $ver  = "${{ steps.vars.outputs.version }}"
          $base = "https://github.com/${{ github.repository }}/releases/latest/download"

          $src = "inconnu"
          $sf = Join-Path $pwd "contents\.sync-info.json"
          if (Test-Path $sf) {
            try {
              $j = Get-Content $sf -Raw | ConvertFrom-Json
              $sha = if ($j.sourceSha.Length -ge 7) { $j.sourceSha.Substring(0,7) } else { $j.sourceSha }
              $src = "$($j.source) @ $sha (synchronisé le $($j.syncedAtUtc))"
            } catch {}
          }

          $bb = '``'

          if ("$env:PFX_MODE" -eq 'ephemeral') {
            $certNote = @(
              '> ⚠️ **Build signé avec un certificat auto-signé éphémère.**'
              ("> Installez d'abord " + $bb + 'ToolsBoXApp.cer' + $bb + ' (double-clic → Ordinateur local → *Trusted People*),')
              ('> puis le ' + $bb + '.appinstaller' + $bb + '. Les mises à jour automatiques deviennent fiables dès que les')
              ('> secrets ' + $bb + 'CERT_BASE64' + $bb + ' / ' + $bb + 'CERT_PASSWORD' + $bb + ' sont configurés (voir le README du dépôt).')
            ) -join "`n"
          } else {
            $certNote = '🔏 Signature : certificat ' + $bb + 'ToolsBoXApp.cer' + $bb + ' (à installer une fois dans *Trusted People*).'
          }

          $bodyLines = @(
            "## 🪟 Build $tag"
            ''
            '| | |'
            '|---|---|'
            ('| **Version du paquet** | ' + $bb + $ver + $bb + ' |')
            ('| **Contenu** | ' + $src + ' |')
            ("| **Fichier d'installation** | [" + $bb + 'ToolsBoXApp.appinstaller' + $bb + '](' + $base + '/ToolsBoXApp.appinstaller) |')
            ''
            '### Installation'
            '- **Automatique (recommandé)** — PowerShell :'
            '  ```powershell'
            ('  irm ' + $base + '/install-app.ps1 | iex')
            '  ```'
            ('- **Manuelle** — installez ' + $bb + 'ToolsBoXApp.cer' + $bb + ' (double-clic → *Ordinateur local* → **Trusted People**),')
            ('  puis téléchargez et double-cliquez ' + $bb + 'ToolsBoXApp.appinstaller' + $bb + '.')
            ''
            '### Mises à jour'
            "Une fois installée, l'app se met à jour automatiquement au lancement lorsque ce"
            'build est le plus récent.'
            ''
            $certNote
            ''
            '### Sommes de contrôle (SHA256)'
            '```'
            (Get-Content "$pwd\artifacts\checksums.txt" -Raw)
            '```'
          )
          $body = $bodyLines -join "`n"
          "body<<RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT

      - name: Publier la release ${{ steps.vars.outputs.tag }}
        if: steps.vars.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Build ${{ steps.vars.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            ${{ steps.verify.outputs.msix }}
            artifacts/ToolsBoXApp.appinstaller
            artifacts/ToolsBoXApp.cer
            artifacts/checksums.txt
            install-app.ps1