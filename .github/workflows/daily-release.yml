name: Daily Build & Release

# Daily build of ToolsBoXApp (x64 NSIS installer) from the content synced
# from ToolsBoXMachine, then publication as a GitHub release.
#
# - every day at midnight (UTC)
# - or on demand from the repository Actions tab

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      do_sync:
        description: "Sync contents/ from ToolsBoXMachine"
        type: boolean
        default: true
      do_release:
        description: "Create / update the GitHub release"
        type: boolean
        default: true
      sync_branch:
        description: "Source branch to sync"
        type: string
        default: "main"

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  TBX_SOURCE_REPO: RackRunner1/ToolsBoXMachine
  SETUP_ASSET: ToolsBoXApp-Setup-x64.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------------
      # Build date, version (semver YYYY.M.D) and release tag (YYYYMMDD)
      # ---------------------------------------------------------------------
      - name: Compute build date, version and options
        id: vars
        shell: pwsh
        run: |
          $buildDate = [DateTime]::UtcNow
          $version = "$($buildDate.Year).$($buildDate.Month).$($buildDate.Day)"
          $tag = $buildDate.ToString('yyyyMMdd')

          $doSync = $false
          $doRelease = $false
          $branch = 'main'

          switch ($env:GITHUB_EVENT_NAME) {
            'schedule' {
              $doSync = $true
              $doRelease = $true
            }
            'workflow_dispatch' {
              $doSync = "${{ inputs.do_sync }}" -ne 'false'
              $doRelease = "${{ inputs.do_release }}" -ne 'false'
              $branch = "${{ inputs.sync_branch }}"
              if ([string]::IsNullOrWhiteSpace($branch)) { $branch = 'main' }
            }
            default {
              $doSync = $true
              $doRelease = $true
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "date=$($buildDate.ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT
          "do_sync=$($doSync.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "do_release=$($doRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Build $tag (version $version) - sync=$doSync release=$doRelease branch=$branch"

      # ---------------------------------------------------------------------
      # 1. Fetch the content from ToolsBoXMachine
      # ---------------------------------------------------------------------
      - name: Sync contents/ from ToolsBoXMachine
        if: steps.vars.outputs.do_sync == 'true'
        shell: pwsh
        run: .\scripts\sync-contents.ps1 -SourceRepo "https://github.com/${{ env.TBX_SOURCE_REPO }}.git" -Branch "${{ steps.vars.outputs.branch }}"

      - name: Commit & push contents/
        if: steps.vars.outputs.do_sync == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A contents
          if ($LASTEXITCODE -ne 0) { throw "git add failed" }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes in contents/ (source unchanged)."
            exit 0
          }

          git commit -m "chore(contents): sync ToolsBoXMachine ${{ steps.vars.outputs.tag }}" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          try {
            git push
          }
          catch {
            Write-Host "Push rejected, rebasing then retrying."
            git pull --rebase
            git push
          }
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }

      # ---------------------------------------------------------------------
      # 2. Build preparation (web assets, icons, version)
      # ---------------------------------------------------------------------
      - name: Prepare web assets (embedded into the binary)
        shell: pwsh
        run: .\scripts\prepare-web.ps1

      - name: Generate icons from the content logo
        shell: pwsh
        run: .\scripts\generate-icons.ps1

      - name: Inject the build version
        shell: pwsh
        run: |
          $version = "${{ steps.vars.outputs.version }}"
          $config = "app\src-tauri\tauri.conf.json"
          if (-not (Test-Path $config)) { throw "$config not found" }

          # Targeted replacement (no full JSON rewrite: Tauri's serde_json
          # rejects files with a UTF-8 BOM).
          $raw = [IO.File]::ReadAllText($config)
          $new = [regex]::Replace(
            $raw,
            '"version"\s*:\s*"[^"]*"',
            ('"version": "' + $version + '"'),
            [Text.RegularExpressions.RegexOptions]::IgnoreCase,
            [TimeSpan]::FromSeconds(5))
          if ($new -eq $raw) { throw "Cannot inject version $version into $config" }
          [IO.File]::WriteAllText($config, $new, (New-Object Text.UTF8Encoding($false)))

          $check = [regex]::Match([IO.File]::ReadAllText($config), '"version"\s*:\s*"([^"]*)"').Groups[1].Value
          if ($check -ne $version) { throw "Check failed: version read = '$check'" }
          Write-Host "Version injected: $check"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install JS dependencies (Tauri CLI)
        working-directory: app
        run: npm install --no-audit --no-fund

      # ---------------------------------------------------------------------
      # 3. Build the x64 NSIS installer
      # ---------------------------------------------------------------------
      - name: Build (release) + NSIS bundler
        working-directory: app
        run: npm run build

      - name: Collect the installer
        id: installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          $candidates = Get-ChildItem -Path "app\src-tauri\target" -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending
          if (-not $candidates) { throw "No NSIS installer produced under app\src-tauri\target" }

          $setup = $candidates[0]
          Copy-Item $setup.FullName (Join-Path "artifacts" $env:SETUP_ASSET) -Force
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

          $display = (Get-AuthenticodeSignature $setup.FullName)
          Write-Host "Authenticode signature: $($display.Status)"

          $sha = (Get-FileHash (Join-Path "artifacts" $env:SETUP_ASSET) -Algorithm SHA256).Hash.ToLower()
          "$sha  $env:SETUP_ASSET" | Set-Content (Join-Path "artifacts" "checksums.txt") -Encoding utf8
          "path=$(Join-Path (Get-Location) "artifacts" $env:SETUP_ASSET)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "source_name=$($setup.Name)" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 4. Release notes (installation only)
      # ---------------------------------------------------------------------
      - name: Prepare the release notes
        if: steps.vars.outputs.do_release == 'true'
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $lines = @(
            "## ToolsBoXApp $tag"
            ""
            "### Installation"
            "- Download $env:SETUP_ASSET below and run it (per-user install, no admin rights needed)."
            "- The app checks for newer versions automatically on startup."
          )

          "body<<RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          ($lines -join "`n") >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 5. Publish the release
      # ---------------------------------------------------------------------
      - name: Publish the ${{ steps.vars.outputs.tag }} release
        if: steps.vars.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/${{ env.SETUP_ASSET }}
            artifacts/checksums.txt
