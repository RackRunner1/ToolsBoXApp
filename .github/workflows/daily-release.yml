name: Daily Build & Release

# Daily build of ToolsBoXApp (x64 DEB + RPM + Arch packages) from the content synced
# from ToolsBoXMachine, then publication as a GitHub release.
#
# - every day at midnight (UTC)
# - or on demand from the repository Actions tab
#
# Linux only. All packages also install the `tbxa`/`tbxm` terminal companion
# (`tbxa update` / `tbxa uninstall` / same with `tbxm`): .deb for
# Debian/Ubuntu, .rpm for Fedora/RHEL, .pkg.tar.zst for Arch Linux.
#
# The `check` job compares the source commit embedded in the latest release
# with the current upstream HEAD: when ToolsBoXMachine has not moved, the
# `build` job is skipped entirely (no identical rebuild, no empty release).
# Pass `force: true` on manual runs to rebuild anyway (e.g. after app-code
# changes with no upstream movement).

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      do_sync:
        description: "Sync contents/ from ToolsBoXMachine"
        type: boolean
        default: true
      do_release:
        description: "Create / update the GitHub release"
        type: boolean
        default: true
      sync_branch:
        description: "Source branch to sync"
        type: string
        default: "main"
      force:
        description: "Bypass the upstream-change check and build anyway"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  TBX_SOURCE_REPO: RackRunner1/ToolsBoXMachine

jobs:
  # -----------------------------------------------------------------------
  # Should we build? Compare upstream HEAD with the source commit embedded
  # in the latest published release.
  # -----------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      last_tag: ${{ steps.changes.outputs.last_tag }}
      last_sha: ${{ steps.changes.outputs.last_sha }}
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      date: ${{ steps.vars.outputs.date }}
      branch: ${{ steps.vars.outputs.branch }}
      do_sync: ${{ steps.vars.outputs.do_sync }}
      do_release: ${{ steps.vars.outputs.do_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute build date, version and options
        id: vars
        run: |
          VERSION="$(date -u +"%-Y.%-m.%-d")"
          TAG="$(date -u +%Y%m%d)"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="main"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DO_SYNC=true
            DO_RELEASE=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DO_SYNC="${{ inputs.do_sync }}"
            DO_RELEASE="${{ inputs.do_release }}"
            BRANCH="${{ inputs.sync_branch }}"
            [ -z "$BRANCH" ] && BRANCH="main"
          else
            DO_SYNC=true
            DO_RELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "date=$DATE"
            echo "branch=$BRANCH"
            echo "do_sync=$DO_SYNC"
            echo "do_release=$DO_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Build $TAG (version $VERSION) - sync=$DO_SYNC release=$DO_RELEASE branch=$BRANCH"

      - name: Check for upstream changes since the latest release
        id: changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"

          # Any doubt below defaults to building (safe direction).
          LATEST_TAG="$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null)"
          echo "last_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"

          LAST_SHA=""
          if [ -n "$LATEST_TAG" ]; then
            if git fetch --depth 1 origin tag "$LATEST_TAG" 2>/dev/null; then
              LAST_SHA="$(git show "$LATEST_TAG:contents/.sync-info.json" 2>/dev/null \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('sourceSha',''))" 2>/dev/null)"
            fi
          fi
          echo "last_sha=${LAST_SHA:-}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild (force=true), skipping the upstream check."
            exit 0
          fi

          if [ -z "$LATEST_TAG" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "No previous release found (or API unreachable), building."
            exit 0
          fi
          echo "Latest release: $LATEST_TAG"

          UPSTREAM_SHA="$(git ls-remote "https://github.com/${{ env.TBX_SOURCE_REPO }}.git" "refs/heads/$BRANCH" 2>/dev/null | cut -f1)"
          echo "Source embedded in release $LATEST_TAG: ${LAST_SHA:-unknown}"
          echo "Upstream $BRANCH HEAD: ${UPSTREAM_SHA:-unknown}"

          if [ -n "$LAST_SHA" ] && [ -n "$UPSTREAM_SHA" ] && [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits on ${{ env.TBX_SOURCE_REPO }} ($BRANCH) since release $LATEST_TAG. Skipping the build (use force=true to rebuild anyway)."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits detected, building."
          fi

  # -----------------------------------------------------------------------
  # Full pipeline: sync, build the DEB + RPM + Arch packages, publish the release.
  # Runs only when the check job detected upstream changes.
  # -----------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 1. Fetch the content from ToolsBoXMachine
      # ---------------------------------------------------------------------
      - name: Sync contents/ from ToolsBoXMachine
        if: needs.check.outputs.do_sync == 'true'
        run: ./scripts/sync-contents.sh --source-repo "https://github.com/${{ env.TBX_SOURCE_REPO }}.git" --branch "${{ needs.check.outputs.branch }}"

      - name: Commit & push contents/
        if: needs.check.outputs.do_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A contents
          if git diff --cached --quiet; then
            echo "No changes in contents/ (source unchanged)."
            exit 0
          fi
          git commit -m "chore(contents): sync ToolsBoXMachine ${{ needs.check.outputs.tag }}"
          git push || { echo "Push rejected, rebasing then retrying."; git pull --rebase && git push; }

      # ---------------------------------------------------------------------
      # 2. Build preparation (web assets, JS deps, icons, version)
      # ---------------------------------------------------------------------
      - name: Prepare web assets (embedded into the binary)
        run: ./scripts/prepare-web.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies (Tauri CLI)
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Generate icons from the content logo
        run: ./scripts/generate-icons.sh

      - name: Inject the build version
        run: |
          python3 - "app/src-tauri/tauri.conf.json" "${{ needs.check.outputs.version }}" <<'PYEOF'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as f:
              raw = f.read()
          new = re.sub(r'"version"\s*:\s*"[^"]*"', f'"version": "{version}"', raw, count=1, flags=re.IGNORECASE)
          assert new != raw, "cannot inject version"
          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write(new)
          check = re.search(r'"version"\s*:\s*"([^"]*)"', new).group(1)
          assert check == version, f"check failed: {check}"
          print(f"Version injected: {check}")
          PYEOF

      # ---------------------------------------------------------------------
      # 3. Toolchains (Rust + Linux WebKit build dependencies)
      # ---------------------------------------------------------------------
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            rpm rsync python3-pil zstd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (Tauri app)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---------------------------------------------------------------------
      # 4. Test + build the tbxa companion CLI
      # ---------------------------------------------------------------------
      - name: Test the tbxa CLI
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Build the tbxa CLI (release)
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          ls -la cli/target/release/tbxa
          ./cli/target/release/tbxa --help
          cp cli/target/release/tbxa /tmp/tbxm
          /tmp/tbxm --help | grep -q "tbxm"

      # ---------------------------------------------------------------------
      # 5. Build the x64 DEB + RPM + Arch packages
      # ---------------------------------------------------------------------
      - name: Build (release) + DEB/RPM bundlers
        working-directory: app
        run: npm run build

      - name: Collect and verify the packages
        id: pkgs
        run: |
          mkdir -p artifacts
          RPM="$(ls -t app/src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -n 1)"
          [ -n "$RPM" ] || { echo "No RPM produced under app/src-tauri/target/release/bundle/rpm" >&2; exit 1; }
          echo "Picked RPM: $RPM"
          cp "$RPM" artifacts/
          echo "rpm_asset=$(basename "$RPM")" >> "$GITHUB_OUTPUT"

          DEB="$(ls -t app/src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)"
          [ -n "$DEB" ] || { echo "No DEB produced under app/src-tauri/target/release/bundle/deb" >&2; exit 1; }
          echo "Picked DEB: $DEB"
          cp "$DEB" artifacts/
          echo "deb_asset=$(basename "$DEB")" >> "$GITHUB_OUTPUT"

          echo "--- rpm info ---"
          rpm -qip "artifacts/$(basename "$RPM")"
          echo "--- rpm contents ---"
          rpm -qlp "artifacts/$(basename "$RPM")" | tee /tmp/rpm-list.txt
          grep -q "/usr/bin/tbxa" /tmp/rpm-list.txt || { echo "tbxa missing from the RPM!" >&2; exit 1; }
          grep -q "/usr/bin/tbxm" /tmp/rpm-list.txt || { echo "tbxm missing from the RPM!" >&2; exit 1; }
          grep -q "/usr/bin/toolsboxapp" /tmp/rpm-list.txt || { echo "app binary missing from the RPM!" >&2; exit 1; }
          grep -q "\.desktop$" /tmp/rpm-list.txt || { echo "desktop file missing from the RPM!" >&2; exit 1; }
          echo "RPM verified: app binary, tbxa, tbxm and desktop file present."

          echo "--- deb info ---"
          dpkg-deb --info "artifacts/$(basename "$DEB")"
          echo "--- deb contents ---"
          dpkg-deb --contents "artifacts/$(basename "$DEB")" | tee /tmp/deb-list.txt
          grep -q "usr/bin/tbxa" /tmp/deb-list.txt || { echo "tbxa missing from the DEB!" >&2; exit 1; }
          grep -q "usr/bin/tbxm" /tmp/deb-list.txt || { echo "tbxm missing from the DEB!" >&2; exit 1; }
          grep -q "usr/bin/toolsboxapp" /tmp/deb-list.txt || { echo "app binary missing from the DEB!" >&2; exit 1; }
          grep -q "\.desktop$" /tmp/deb-list.txt || { echo "desktop file missing from the DEB!" >&2; exit 1; }
          echo "DEB verified: app binary, tbxa, tbxm and desktop file present."

          (cd artifacts && sha256sum *.rpm *.deb > checksums.txt)
          cat artifacts/checksums.txt

      - name: Build the Arch Linux package (.pkg.tar.zst)
        run: |
          ./scripts/build-arch-pkg.sh "${{ needs.check.outputs.version }}"
          ls -la artifacts/*.pkg.tar.zst
          (cd artifacts && sha256sum *.pkg.tar.zst >> checksums.txt)
          cat artifacts/checksums.txt

      # ---------------------------------------------------------------------
      # 6. Release notes (changelog Machine + App, comme ToolsBoXMachine)
      # ---------------------------------------------------------------------
      - name: Prepare the release notes
        if: needs.check.outputs.do_release == 'true'
        id: notes
        env:
          TAG: ${{ needs.check.outputs.tag }}
          LAST_TAG: ${{ needs.check.outputs.last_tag }}
          LAST_SHA: ${{ needs.check.outputs.last_sha }}
          SOURCE_REPO: ${{ env.TBX_SOURCE_REPO }}
          BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          echo "=== Generating notes ==="
          echo "TAG: $TAG"
          echo "LAST_TAG: $LAST_TAG"
          echo "LAST_SHA: $LAST_SHA"

          NEW_SHA="$(python3 -c "import json; print(json.load(open('contents/.sync-info.json')).get('sourceSha',''))" 2>/dev/null || true)"
          echo "NEW_SHA: $NEW_SHA"

          OUTPUT_FILE=$(mktemp)
          FIX_FILE=$(mktemp)
          FEAT_FILE=$(mktemp)
          REFACTOR_FILE=$(mktemp)
          PERF_FILE=$(mktemp)
          STYLE_FILE=$(mktemp)
          CHORE_FILE=$(mktemp)
          DOCS_FILE=$(mktemp)
          CI_FILE=$(mktemp)
          TEST_FILE=$(mktemp)
          OTHER_FILE=$(mktemp)

          # Header identique a ToolsBoXMachine
          {
            echo "# 🪟 Build Name: ${TAG}"
            echo ""
            echo "## 🌟 What's Changed"
            echo ""
          } > "$OUTPUT_FILE"

          COMMIT_REGEX='^([a-zA-Z]+)(\(([^)]+)\))?!?:\ (.+)$'

          # Meme categorisation que ToolsBoXMachine, liste fusionnee Machine + App.
          # Les commits chore(contents) de sync sont exclus (redondants avec le detail Machine).
          categorize() {
            while IFS='|' read -r HASH MSG; do
              [ -z "$HASH" ] && continue
              case "$MSG" in
                "chore(contents):"*) continue ;;
              esac
              SHORT="${HASH:0:7}"

              if [[ "$MSG" =~ $COMMIT_REGEX ]]; then
                TYPE="${BASH_REMATCH[1]}"
                SCOPE="${BASH_REMATCH[3]}"
                COMMIT_MSG="${BASH_REMATCH[4]}"

                if [ -n "$SCOPE" ]; then
                  LINE="- ${TYPE}(${SCOPE}): ${COMMIT_MSG} (\`${SHORT}\`)"
                else
                  LINE="- ${TYPE}: ${COMMIT_MSG} (\`${SHORT}\`)"
                fi

                case "${TYPE,,}" in
                  feat)     echo "$LINE" >> "$FEAT_FILE" ;;
                  fix)      echo "$LINE" >> "$FIX_FILE" ;;
                  chore)    echo "$LINE" >> "$CHORE_FILE" ;;
                  docs)     echo "$LINE" >> "$DOCS_FILE" ;;
                  style)    echo "$LINE" >> "$STYLE_FILE" ;;
                  refactor) echo "$LINE" >> "$REFACTOR_FILE" ;;
                  perf)     echo "$LINE" >> "$PERF_FILE" ;;
                  ci)       echo "$LINE" >> "$CI_FILE" ;;
                  test)     echo "$LINE" >> "$TEST_FILE" ;;
                  *)        echo "$LINE" >> "$OTHER_FILE" ;;
                esac
              else
                echo "- ${MSG} (\`${SHORT}\`)" >> "$OTHER_FILE"
              fi
            done
          }

          # -- Commits App depuis la derniere release App --
          echo "App commits since ${LAST_TAG:-(none)}:"
          if [ -n "$LAST_TAG" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            git log "${LAST_TAG}..HEAD" --pretty=tformat:"%H|%s" --no-merges | tee /tmp/app-commits.txt | head -5
            categorize < /tmp/app-commits.txt
          else
            echo "No last App tag, taking all App commits"
            git log --pretty=tformat:"%H|%s" --no-merges | tee /tmp/app-commits.txt | head -5
            categorize < /tmp/app-commits.txt
          fi

          # -- Commits Machine entre l'ancien et le nouveau sourceSha --
          echo "Cloning $SOURCE_REPO for upstream log..."
          rm -rf /tmp/tbxm-log
          git clone --quiet "https://github.com/${SOURCE_REPO}.git" --branch "$BRANCH" /tmp/tbxm-log 2>/dev/null || echo "Upstream clone failed, skipping Machine commits."
          if [ -d /tmp/tbxm-log ]; then
            echo "Machine commits ${LAST_SHA:-?(none)}..${NEW_SHA:-HEAD}:"
            if [ -n "$LAST_SHA" ] && [ -n "$NEW_SHA" ] && [ "$LAST_SHA" != "$NEW_SHA" ] \
              && git -C /tmp/tbxm-log cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null \
              && git -C /tmp/tbxm-log cat-file -e "${NEW_SHA}^{commit}" 2>/dev/null; then
              git -C /tmp/tbxm-log log "${LAST_SHA}..${NEW_SHA}" --pretty=tformat:"%H|%s" --no-merges | tee /tmp/machine-commits.txt | head -5
              categorize < /tmp/machine-commits.txt
            elif [ -n "$NEW_SHA" ] && git -C /tmp/tbxm-log cat-file -e "${NEW_SHA}^{commit}" 2>/dev/null; then
              echo "No usable LAST_SHA, taking all Machine commits up to $NEW_SHA"
              git -C /tmp/tbxm-log log "$NEW_SHA" --pretty=tformat:"%H|%s" --no-merges | tee /tmp/machine-commits.txt | head -5
              categorize < /tmp/machine-commits.txt
            else
              echo "No usable NEW_SHA, taking latest Machine commits from $BRANCH"
              git -C /tmp/tbxm-log log --pretty=tformat:"%H|%s" --no-merges | tee /tmp/machine-commits.txt | head -5
              categorize < /tmp/machine-commits.txt
            fi
            rm -rf /tmp/tbxm-log
          fi

          # Sections dans le meme ordre que ToolsBoXMachine
          append_section() {
            local file="$1"
            local title="$2"
            if [ -s "$file" ]; then
              echo "### $title" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
              cat "$file" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
            fi
          }

          append_section "$FIX_FILE" "🐛 Fixed"
          append_section "$FEAT_FILE" "➕ Added or Removed"
          append_section "$REFACTOR_FILE" "♻️ Refactored"
          append_section "$PERF_FILE" "⚡ Performance"
          append_section "$STYLE_FILE" "💄 Style"
          append_section "$CHORE_FILE" "🔧 Chores"
          append_section "$DOCS_FILE" "📚 Documentation"
          append_section "$CI_FILE" "🔄 CI"
          append_section "$TEST_FILE" "✅ Tests"
          append_section "$OTHER_FILE" "📦 Other"

          rm -f "$FIX_FILE" "$FEAT_FILE" "$REFACTOR_FILE" "$PERF_FILE" "$STYLE_FILE" "$CHORE_FILE" "$DOCS_FILE" "$CI_FILE" "$TEST_FILE" "$OTHER_FILE"

          {
            echo "body<<RELEASEEOF"
            cat "$OUTPUT_FILE"
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"

          rm -f "$OUTPUT_FILE"

      # ---------------------------------------------------------------------
      # 7. Publish the release
      # ---------------------------------------------------------------------
      - name: Publish the ${{ needs.check.outputs.tag }} release
        if: needs.check.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            artifacts/*.rpm
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
            artifacts/checksums.txt
