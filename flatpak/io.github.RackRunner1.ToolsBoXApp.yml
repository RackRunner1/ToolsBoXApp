app-id: io.github.RackRunner1.ToolsBoXApp
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: io.github.RackRunner1.ToolsBoXApp

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/toolsboxapp/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: toolsboxapp
    buildsystem: simple
    build-commands:
      # 1. Prepare web assets staged for embedding
      - bash scripts/prepare-web.sh

      # 2. Compile Tauri application binary (GUI only, no CLI)
      - cargo --offline build --release --manifest-path app/src-tauri/Cargo.toml

      # 3. Install binary
      - install -Dm755 app/src-tauri/target/release/toolsboxapp ${FLATPAK_DEST}/bin/${FLATPAK_ID}

      # 4. Install desktop entry and AppStream metainfo
      - install -Dm644 data/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

      # 5. Install application icons
      - install -Dm644 data/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 data/icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 data/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 data/icons/512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png

    sources:
      - type: git
        url: https://github.com/RackRunner1/ToolsBoXApp.git
        tag: 20261023
        commit: 1c99915c15df75831f281c58a3df970c86e3ccb9
        x-checker-data:
          type: git
          tag-pattern: ^(\d{8})$
      - cargo-sources.json
